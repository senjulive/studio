version: '3.8'

services:
  # AstralCore Web Application
  astralcore:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: astralcore-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://astralcore_user:password@postgres:5432/astralcore
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - astralcore-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: astralcore-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: astralcore
      POSTGRES_USER: astralcore_user
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    networks:
      - astralcore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astralcore_user -d astralcore"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: astralcore-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redispassword
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - astralcore-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: astralcore-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - astralcore
    restart: unless-stopped
    networks:
      - astralcore-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  astralcore-network:
    driver: bridge
